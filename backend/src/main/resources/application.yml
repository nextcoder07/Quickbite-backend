server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: quickbite-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

quickbite:
  firebase:
    enabled: ${FIREBASE_AUTH_ENABLED:false}
    config-path: ${FIREBASE_CONFIG_PATH:firebase-adminsdk.json}
    project-id: ${FIREBASE_PROJECT_ID:quickbite-campus}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_samplekey123}
    key-secret: ${RAZORPAY_KEY_SECRET:sample_secret_key_456}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:sample_webhook_secret_789}
  storage:
    supabase-url: ${SUPABASE_URL:https://example.supabase.co}
    service-key: ${SUPABASE_SERVICE_ROLE_KEY:example_service_role_key}
    bucket: ${SUPABASE_STORAGE_BUCKET:QuickBite}
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
      - "file://"
      - "*"
